services:
  - type: web
    name: geeta-arts
    env: php
    plan: free
    autoDeploy: true
    buildCommand: composer install --no-dev --optimize-autoloader && mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    postDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://geeta-arts.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: geeta-arts-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file

databases:
  - name: geeta-arts-db
    plan: free
    ipAllowList: []
